name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Windows has no cgroups, CPU affinity or /proc, so most of the detection is
          # skipped there; the oldest and newest Python check that everything still imports,
          # applies thread limits, and degrades without errors.
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  # The package claims to need nothing but the standard library: install it
  # alone, with none of the libraries it limits, and run it.
  standard-library-only:
    name: no dependencies installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install .
      - run: python -m stream_limits
      - run: python -c "import stream_limits as s; s.set_limits(threads=2, memory_gb=8); s.limit_threads(1); print(s.MemoryBudget().headroom_gb())"

  package:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
